# Daily backstop for the fleet preview manifest: deletes entries past their
# expiresAt (at most 30 days after the last registration) and their aliases.
# Readers already ignore expired entries, so correctness never depends on this.
name: Preview manifest sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-manifest-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep expired preview entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch automation secrets from Phase
        env:
          PHASE_TOKEN: ${{ secrets.PHASE_SDLC_TOKEN }}
        run: node scripts/phase/export-secrets.mjs VERCEL_API_TOKEN

      - name: Sweep
        uses: ./.github/actions/preview-manifest
        with:
          mode: sweep
          vercel_token: ${{ env.VERCEL_API_TOKEN || secrets.VERCEL_API_TOKEN }}
