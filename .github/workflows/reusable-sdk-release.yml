# Reusable Changesets release for MonetizeKit SDK packages.
# Publishes to npm with provenance (requires caller permissions:
# contents: write, pull-requests: write, id-token: write and secrets: inherit).
name: Reusable SDK Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check NPM_TOKEN
        id: npm-token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::NPM_TOKEN is not set (sync from Phase.dev to the Production environment); skipping publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release PR or publish
        if: steps.npm-token.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance: links the published tarball to this workflow run (public repos)
          NPM_CONFIG_PROVENANCE: "true"
