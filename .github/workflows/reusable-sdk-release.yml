# Reusable Changesets release for MonetizeKit SDK packages.
# Publishes to npm with provenance (requires caller permissions:
# actions: write, contents: write, pull-requests: write, id-token: write and
# secrets: inherit).
#
# A release PR opened with GITHUB_TOKEN does not trigger pull_request or push
# workflows, so the required "Required Checks Gate" would never report on it.
# workflow_dispatch is exempt from that rule: after the release PR branch is
# updated, CI is dispatched on it and its check runs attach to the PR head.
name: Reusable SDK Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check NPM_TOKEN
        id: npm-token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::NPM_TOKEN is not set (sync from Phase.dev to the Production environment); skipping publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release PR or publish
        id: changesets
        if: steps.npm-token.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance: links the published tarball to this workflow run (public repos)
          NPM_CONFIG_PROVENANCE: "true"
      - name: Run CI on the release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"
