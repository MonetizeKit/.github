# Reusable Changesets release for MonetizeKit SDK packages.
# Publishes to npm with npm trusted publishing (OIDC) and provenance. Requires
# caller permissions: contents: write, pull-requests: write, id-token: write
# and secrets: inherit. There is no npm token: each package must have a
# trusted publisher on npmjs.com naming the caller's repository, the workflow
# file `release.yml` (the caller, not this reusable file) and the environment
# `Production`, with direct `npm publish` allowed. A package without one
# fails its publish with E404.
#
# The release PR is opened and updated with the automation account's token
# (GH_PAT, fetched at run time from Phase.dev like the promotion bot does), not
# the workflow's GITHUB_TOKEN. A PR pushed by GITHUB_TOKEN gets its
# pull_request runs parked as `action_required` awaiting a human click, so the
# required "Required Checks Gate" never reports; a PR pushed by a repository
# collaborator runs CI immediately. Without the credential the job falls back
# to GITHUB_TOKEN and the release PR needs its workflow runs approved by hand.
# The token is fetched only after dependencies are installed.
name: Reusable SDK Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      policy_ref:
        description: Ref of MonetizeKit/.github the Phase helper is fetched from
        type: string
        default: "v1"
      phase_env:
        description: Phase.dev environment holding the automation credentials
        type: string
        default: "sdlc"
      phase_app_id:
        description: Phase.dev application id
        type: string
        default: "026988b7-1ffa-499c-913b-3d0f031c4e58"
    secrets:
      PHASE_SDLC_TOKEN:
        description: Phase.dev service token scoped to the `sdlc` environment; GH_PAT is fetched from it at run time
        required: false

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # No registry-url: setup-node would write an .npmrc carrying a
      # NODE_AUTH_TOKEN placeholder, and a token in the npm config competes
      # with the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      # `pnpm publish` (what `changeset publish` runs under pnpm) hands the
      # upload to the npm CLI, and npm only performs the OIDC exchange from
      # 11.5.1. Node 22 bundles npm 10.
      - name: Install npm with trusted publishing support
        run: |
          npm install -g npm@11
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }' "$(npm --version)"
          echo "npm $(npm --version)"
      # GH_PAT is a long-lived org credential: it must not exist in the job
      # environment or in persisted git credentials while dependency install
      # scripts run. changesets/action writes its own ~/.netrc from the token
      # it is given, so the checkout needs no stored credentials.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch automation secrets from Phase
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
          PHASE_TOKEN: ${{ secrets.PHASE_SDLC_TOKEN }}
          PHASE_ENV: ${{ inputs.phase_env }}
          PHASE_APP_ID: ${{ inputs.phase_app_id }}
        run: |
          mkdir -p /tmp/phase-export
          curl -fsSL "https://raw.githubusercontent.com/MonetizeKit/.github/${POLICY_REF}/scripts/phase/export-secrets.mjs" -o /tmp/phase-export/export-secrets.mjs
          node /tmp/phase-export/export-secrets.mjs GH_PAT
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ env.GH_PAT || secrets.GITHUB_TOKEN }}
          # npm provenance: links the published tarball to this workflow run (public repos)
          NPM_CONFIG_PROVENANCE: "true"
