# Reusable Changesets release for MonetizeKit SDK packages.
# Publishes to npm with provenance (requires caller permissions:
# contents: write, pull-requests: write, id-token: write and secrets: inherit).
#
# The release PR is opened and updated with the automation account's token
# (GH_PAT, fetched at run time from Phase.dev like the promotion bot does), not
# the workflow's GITHUB_TOKEN. A PR pushed by GITHUB_TOKEN gets its
# pull_request runs parked as `action_required` awaiting a human click, so the
# required "Required Checks Gate" never reports; a PR pushed by a repository
# collaborator runs CI immediately. Without the credential the job falls back
# to GITHUB_TOKEN and the release PR needs its workflow runs approved by hand.
name: Reusable SDK Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      policy_ref:
        description: Ref of MonetizeKit/.github the Phase helper is fetched from
        type: string
        default: "v1"
      phase_env:
        description: Phase.dev environment holding the automation credentials
        type: string
        default: "sdlc"
      phase_app_id:
        description: Phase.dev application id
        type: string
        default: "026988b7-1ffa-499c-913b-3d0f031c4e58"
    secrets:
      NPM_TOKEN:
        required: false
      PHASE_SDLC_TOKEN:
        description: Phase.dev service token scoped to the `sdlc` environment; GH_PAT is fetched from it at run time
        required: false

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Fetch automation secrets from Phase
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
          PHASE_TOKEN: ${{ secrets.PHASE_SDLC_TOKEN }}
          PHASE_ENV: ${{ inputs.phase_env }}
          PHASE_APP_ID: ${{ inputs.phase_app_id }}
        run: |
          mkdir -p /tmp/phase-export
          curl -fsSL "https://raw.githubusercontent.com/MonetizeKit/.github/${POLICY_REF}/scripts/phase/export-secrets.mjs" -o /tmp/phase-export/export-secrets.mjs
          node /tmp/phase-export/export-secrets.mjs GH_PAT
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.GH_PAT || github.token }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check NPM_TOKEN
        id: npm-token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::NPM_TOKEN is not set (sync from Phase.dev to the Production environment); skipping publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # npm answers a publish with an expired or revoked token with a bare
      # E404 on PUT, which reads like a missing package. Check the token
      # first; fail only when this run would publish (no pending changesets),
      # so a release PR can still be opened while the token is being rotated.
      - name: Verify NPM_TOKEN
        if: steps.npm-token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if user=$(npm whoami 2>/dev/null); then
            echo "npm token authenticates as ${user}"
            exit 0
          fi
          message="NPM_TOKEN is rejected by the npm registry (expired or revoked). Rotate it in Phase.dev (Production) and let the sync update the Production environment."
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "::warning::${message} Pending changesets: opening the release PR only."
          else
            echo "::error::${message}"
            exit 1
          fi
      - name: Create release PR or publish
        if: steps.npm-token.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ env.GH_PAT || secrets.GITHUB_TOKEN }}
          # changesets/action only reads NPM_TOKEN; without it the action
          # switches to npm trusted publishing, which these packages do not
          # have configured, and the publish fails with E404.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance: links the published tarball to this workflow run (public repos)
          NPM_CONFIG_PROVENANCE: "true"
